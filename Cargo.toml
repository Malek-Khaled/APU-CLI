[package]
name = "apu-cli"
description = "a simple command-line tool to show your APU schedule"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
is_empty = "0.3.0"
reqwest = { version = "0.13.2", features = ["json", "gzip", "brotli"] }
serde_json = "1.0.149"
tokio = {version= "1.51.0", features= ["full"]}
tokio-macros = "2.7.0"
